[project]
site_url = "https://jwallace145.github.io/cs-survival-guide/"
site_name = "CS Survival Guide"
site_description = "A field guide to computer science fundamentals: algorithms, systems, databases, networking, and AI."

# The version below is managed by Release Please — do not edit by hand.
copyright = "CS Survival Guide v0.9.0" # x-release-please-version

repo_url = "https://github.com/jwallace145/cs-survival-guide"
repo_name = "jwallace145/cs-survival-guide"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Data Structures" = [
    { "Dynamic Array" = "data-structures/dynamic-array.md" },
    { "Singly Linked List" = "data-structures/singly-linked-list.md" },
    { "Doubly Linked List" = "data-structures/doubly-linked-list.md" },
  ] },
  { "Math" = [
    { "Cheat Sheet" = "math/cheat-sheet.md" },
  ] },
  { "Networking" = [
    { "HTTP Cheat Sheet" = "networking/http-cheat-sheet.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

# Rebuild on `zensical serve` when the library sources under lib/ change.
watch = ["lib"]

extra_css = ["stylesheets/benchmarks.css"]
# MathJax typesets the LaTeX that pymdownx.arithmatex marks up; mathjax.js
# holds its configuration and must load first.
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Footer links: the guide's source, and the companion library on GitHub and
# PyPI, so readers can find the implementation from any page.
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jwallace145/cs-survival-guide"
name = "cs-survival-guide on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jwallace145/cs-survival-kit"
name = "cs-survival-kit on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/cs-survival-kit/"
name = "cs-survival-kit on PyPI"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Allow docs pages to include files from the repository root
# (used by docs/changelog.md to render the canonical CHANGELOG.md).
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# Macros: pages that set `render_macros: true` in their front matter can call
# the macros defined in guide_macros.py, such as `benchmark(...)`. Rendering
# is opt-in so that braces on other pages are left alone.
[project.plugins.macros]
module_name = "guide_macros"
render_by_default = false
on_error_fail = true
on_undefined = "strict"

# API reference: mkdocstrings renders the cs-survival-kit docstrings from the
# sources that scripts/install-kit.sh places under lib/. The Reference nav
# section itself (api-autonav) lives in zensical.reference.toml, because
# api-autonav fails the build when the package is absent — scripts/zensical.sh
# appends that fragment only when lib/cs_survival_kit exists.
[project.plugins.autorefs]

[project.plugins.mkdocstrings]
default_handler = "python"
# Overrides for the python handler's templates: the source block of every
# class and function links to the implementation on GitHub. The link's base
# URL is set per installed version in zensical.reference.toml.
custom_templates = "templates/mkdocstrings"

[project.plugins.mkdocstrings.handlers.python]
paths = ["lib"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
backlinks = "tree"
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true

# Release management: maintains a running release PR from Conventional
# Commits on main. Merging that PR updates version.txt, CHANGELOG.md, and
# zensical.toml, then creates the SemVer git tag and the GitHub Release.
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

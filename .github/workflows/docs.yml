# Documentation deployment: builds the Zensical site and publishes it to
# GitHub Pages on every push to main. Release management lives separately in
# release-please.yml.
name: Deploy Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # Installs the library version pinned in kit-version.txt into lib/;
      # warns and skips the Reference section if it is not on PyPI.
      - run: scripts/install-kit.sh
      - run: scripts/zensical.sh build --clean
        env:
          # A page naming a benchmark the pinned library lacks fails the build.
          GUIDE_BENCHMARKS_STRICT: "1"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment

# Documentation deployment: builds the Zensical site and publishes it to the
# gh-pages branch, which GitHub Pages serves, on every push to main. Pull
# request previews share that branch under pr-preview/ (see preview.yml).
# Release management lives separately in release-please.yml.
name: Deploy Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # Installs the library version pinned in kit-version.txt into lib/;
      # warns and skips the Reference section if it is not on PyPI.
      - run: scripts/install-kit.sh
      - run: scripts/zensical.sh build --clean
        env:
          # A page naming a benchmark the pinned library lacks fails the build.
          GUIDE_BENCHMARKS_STRICT: "1"
      # GitHub Pages runs branch deployments through Jekyll unless told not to.
      - run: touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          # Leave pull request previews in place when replacing the site.
          clean-exclude: pr-preview/
          # Rebase onto a concurrent preview push instead of overwriting it.
          force: false

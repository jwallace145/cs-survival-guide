# Pull request previews: builds the Zensical site as the deploy job does and
# hands it to the jwall-engineering-sites reusable workflow, which publishes it
# to https://pr-<n>.preview.survival-guide.jwall.engineering/ as the preview
# role and removes it when the pull request closes.
#
# Fork PRs receive no OIDC token, so the jobs only run for branches in this
# repository. Neither job declares a GitHub environment: the preview role
# trusts the `pull_request` OIDC subject, and an environment would change it.
name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # Installs the library version pinned in kit-version.txt into lib/;
      # warns and skips the Reference section if it is not on PyPI.
      - run: scripts/install-kit.sh
      - run: scripts/zensical.sh build --clean
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

  preview:
    name: preview
    needs: build
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-preview.yml@v0.8.0
    with:
      artifact: site
      preview-role-arn: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write # the preview role, through OIDC
      pull-requests: write # the sticky preview comment

# Pull request checks: builds the Zensical site exactly as the deploy job in
# release-please.yml does, without deploying, so a broken build is caught
# before it reaches main; and asks the jwall-engineering-sites CLI to validate
# jwall-engineering-sites.yaml and plan the infrastructure against prod.
name: Build Docs

on:
  pull_request:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # Installs the library version pinned in kit-version.txt into lib/;
      # warns and skips the Reference section if it is not on PyPI.
      - run: scripts/install-kit.sh
      - run: python -m unittest discover -s tests
      - run: scripts/zensical.sh build --clean
        env:
          # A page naming a benchmark the pinned library lacks fails the build.
          GUIDE_BENCHMARKS_STRICT: "1"

  plan:
    name: plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-plan.yml@v0.8.0
    with:
      plan-role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write # the plan role, through OIDC
      pull-requests: write # the sticky plan comment

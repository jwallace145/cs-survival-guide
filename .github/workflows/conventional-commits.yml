# Commit validation: checks that commits reaching main follow Conventional
# Commits so Release Please can compute versions correctly. Runs entirely in
# CI — no local Node.js tooling is required for day-to-day development.
#
# PRs are squash-merged (the only merge method enabled on the repo), and the
# PR title alone becomes the commit message on main. We therefore validate the
# PR title on pull requests, and validate actual commits on direct pushes.
name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    # Skip Release Please's own PRs — their titles are machine-generated,
    # and bot-opened PRs sit in "approval required" otherwise.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
